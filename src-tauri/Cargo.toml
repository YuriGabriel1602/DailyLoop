[package]
name = "dailyloop"
version = "0.2.0"
description = "DailyLoop local productivity cockpit"
authors = ["Yuri Gabriel"]
edition = "2021"

[lib]
name = "dailyloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
